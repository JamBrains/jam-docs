server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Deploy-Commit "@DEPLOY_COMMIT@" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Docusaurus emits content-hashed bundles under /assets/.
    location /assets/ {
        add_header X-Deploy-Commit "@DEPLOY_COMMIT@" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header X-Deploy-Commit "@DEPLOY_COMMIT@" always;
        add_header Cache-Control "no-cache";
        # Docusaurus links omit trailing slashes; serve directory pages without a redirect.
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
